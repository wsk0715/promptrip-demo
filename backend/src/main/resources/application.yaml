spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  application:
    name: promptrip
  
  threads:
    virtual:
      enabled: true

  output:
    ansi:
      enabled: always
  
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:validate}

logging:
  level:
    com.promptrip.core: DEBUG
