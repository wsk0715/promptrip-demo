services:
  db:
    image: postgres:17
    container_name: promptrip-db
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    container_name: promptrip-app
    restart: always
    env_file:
      - .env
      - .secret.env
    volumes:
      - ./logs:/app/logs
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
